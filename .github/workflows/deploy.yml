name: Deploy (manual only)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Environment scenario'
        required: true
        type: choice
        default: 'ec2'
        options:
          - ec2
          - eks-fargate
          - eks-ec2-s3
          - local-wsl
      action:
        description: 'Terragrunt action to run'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy
      region:
        description: 'AWS region'
        required: true
        type: choice
        default: 'eu-central-1'
        options:
          - eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        if: inputs.scenario != 'local-wsl'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Set up Terragrunt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64 \
            -o "$HOME/.local/bin/terragrunt"
          chmod +x "$HOME/.local/bin/terragrunt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Terragrunt apply
        if: inputs.action == 'apply'
        env:
          AWS_DEFAULT_REGION: ${{ inputs.region }}
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
        run: |
          cd envs/${{ inputs.scenario }}
          terragrunt init
          terragrunt apply -auto-approve

      - name: Terragrunt destroy
        if: inputs.action == 'destroy'
        env:
          AWS_DEFAULT_REGION: ${{ inputs.region }}
        run: |
          cd envs/${{ inputs.scenario }}
          terragrunt init
          terragrunt destroy -auto-approve
