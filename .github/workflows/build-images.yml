name: Build AI_Nginx Image (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: AI_Nginx branch or tag to build
        required: false
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the AI_Nginx application
        uses: actions/checkout@v4
        with:
          repository: Izanar/AI_Nginx
          ref: ${{ inputs.ref }}

      - name: Build and push the AI_Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/izanar/image-test-env-kubernetes:latest
            ghcr.io/izanar/image-test-env-kubernetes:${{ github.sha }}
            ghcr.io/izanar/image-test-env-s3:latest
